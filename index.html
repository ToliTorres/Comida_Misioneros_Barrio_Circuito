<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calendario · Comida Misioneros</title>
  <meta name="description" content="Calendario mensual de comidas con los misioneros">
  <meta name="theme-color" content="#fbf5ef">

  <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, etc.)
-->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Calendario · Comida Misioneros">
  <meta property="og:description" content="Consulta qué día te toca dar de comer a los misioneros 🍽️">
  <meta property="og:url" content="https://tolitorres.github.io/Comida_Misioneros_Barrio_Circuito/">
  <meta property="og:image" content="https://tolitorres.github.io/Comida_Misioneros_Barrio_Circuito/imagenes/compartir.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Jesucristo, el Buen Pastor, con sus ovejas">
  <meta property="og:locale" content="es_MX">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <canvas id="particulas" aria-hidden="true"></canvas>
  <div id="luces" class="luces" aria-hidden="true"></div>

  <main class="pagina">
    <header class="encabezado">
      <div id="adornos" class="adornos"></div>
      <div id="escena" class="escena-wrap"></div>
      <p class="pre" id="subtitulo">Comida Misioneros</p>
      <h1 id="titulo">Calendario</h1>
      <p class="frase" id="frase"></p>
    </header>

    <section class="tarjeta calendario" aria-labelledby="titulo">
      <div class="semana" id="semana"></div>
      <div class="rejilla" id="rejilla">
        <p class="cargando">Cargando calendario…</p>
      </div>
      <p class="pista">Toca un día para ver los detalles y el teléfono.</p>
    </section>

    <section class="agenda" id="agenda" aria-label="Lista de días"></section>

    <footer class="pie">
      <p id="aviso"></p>
    </footer>
  </main>

  <!-- Hoja de detalles (se abre al tocar un día) -->
  <div class="velo" id="velo" hidden></div>
  <div class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo" hidden>
    <div class="hoja-asa" aria-hidden="true"></div>
    <button class="cerrar" id="cerrar" aria-label="Cerrar">×</button>
    <h2 id="hoja-titulo"></h2>
    <div id="hoja-cuerpo"></div>
  </div>

  <script src="config.js"></script>
  <script src="temas.js"></script>
  <script src="app.js"></script>
</body>
</html>
